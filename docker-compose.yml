services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/royal-talassa
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Hotel Administrator}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost,http://127.0.0.1}
    command: sh -c "node seed.js && npm start"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: always

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: always

volumes:
  mongo_data:
